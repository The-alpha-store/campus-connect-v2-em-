name: Deploy database to Supabase

# Pushes new files from supabase/migrations to the hosted project.
# It never runs supabase/seed.sql: that file creates sample accounts with a known password.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Push migrations
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Create an environment named "production" in the repository settings and add required
    # reviewers there, so a person approves every production change.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check the secrets are set
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is missing"; exit 1; fi
          done

      - name: Link the project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Show what will change
        run: supabase db push --dry-run

      - name: Apply migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
